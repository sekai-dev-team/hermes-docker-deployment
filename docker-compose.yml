services:
  mcp-gateway:
    image: ${MCP_GATEWAY_IMAGE:-docker/mcp-gateway:latest}
    container_name: ${MCP_GATEWAY_CONTAINER_NAME:-mcp-gateway}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8811}:8811"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hermes-mcp-config:/root/.docker/mcp
      - ./catalog:/catalog:ro
    command:
      - --port=8811
      - --transport=${MCP_GATEWAY_TRANSPORT:-streaming}
      - --profile=${MCP_GATEWAY_PROFILE:-hermes-default}
      - --watch
    healthcheck:
      test:
        - CMD-SHELL
        - wget -S --timeout=2 --tries=1 -O /dev/null http://localhost:8811/mcp 2>&1 | grep -q 'HTTP/'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - hermes-mcp

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    init: true
    restart: always
    command: gateway run
    depends_on:
      mcp-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-/home/<your_username>/.hermes}:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-http://mcp-gateway:8811/mcp}
    shm_size: 1g
    mem_limit: 4g
    cpus: 2.0
    networks:
      - hermes-mcp

  profile-manager:
    build:
      context: ./profile-manager
    image: ${PROFILE_MANAGER_IMAGE:-local/hermes-profile-manager:latest}
    profiles:
      - build-only

networks:
  hermes-mcp:

volumes:
  hermes-mcp-config:
    name: hermes-mcp-config
    external: true
