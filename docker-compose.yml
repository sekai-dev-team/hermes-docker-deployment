services:
  inner-docker:
    image: ${INNER_DOCKER_IMAGE:-docker:27-dind}
    container_name: ${INNER_DOCKER_CONTAINER_NAME:-inner-docker}
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    expose:
      - "2375"
    ports:
      - "127.0.0.1:${INNER_WORKLOAD_PORT_START:-20000}-${INNER_WORKLOAD_PORT_END:-20100}:${INNER_WORKLOAD_PORT_START:-20000}-${INNER_WORKLOAD_PORT_END:-20100}"
    volumes:
      - inner-docker-data:/var/lib/docker
    healthcheck:
      test:
        - CMD-SHELL
        - docker -H tcp://127.0.0.1:2375 info >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - hermes-mcp

  hermes:
    build:
      context: ./hermes
    image: ${HERMES_IMAGE:-local/hermes-agent-docker-cli:latest}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    init: true
    restart: always
    command: gateway run
    depends_on:
      inner-docker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-/home/<your_username>/.hermes}:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      DOCKER_HOST: ${INNER_DOCKER_HOST:-tcp://inner-docker:2375}
    shm_size: 1g
    mem_limit: 4g
    cpus: 2.0
    networks:
      - hermes-mcp

networks:
  hermes-mcp:

volumes:
  inner-docker-data:
    name: ${INNER_DOCKER_DATA_VOLUME:-inner-docker-data}
